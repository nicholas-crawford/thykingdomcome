name: CI

on:
  pull_request:
  # Lets deploy.yml call this workflow and gate on it
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Format, lint and typecheck
        run: vp check
      - name: Test
        run: vp test run
      - name: Build
        run: npm run build
